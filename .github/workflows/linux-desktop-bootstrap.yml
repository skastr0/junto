name: Linux desktop bootstrap

on:
  push:
    tags:
      - "linux-desktop-bootstrap-v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: linux-desktop-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'skastr0/vellum-command'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Refuse unexpected ref
        run: |
          set -eu
          test "${GITHUB_REF_TYPE}" = "tag"
          test "${GITHUB_REF}" = "refs/tags/${GITHUB_REF_NAME}"
          printf '%s' "${GITHUB_REF_NAME}" | grep -E '^linux-desktop-bootstrap-v[0-9]+\.[0-9]+\.[0-9]+$' >/dev/null

      - name: Checkout the tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Bind the triggering commit
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse --verify "${GITHUB_REF}^{commit}")" = "${GITHUB_SHA}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install and build
        run: |
          set -eu
          bun install --frozen-lockfile
          bun run linux:desktop:bootstrap:build

      - name: Record identity
        run: |
          set -eu
          test -x dist/vellum-command-desktop-bootstrap-linux-x64
          sha256sum dist/vellum-command-desktop-bootstrap-linux-x64 \
            > dist/vellum-command-desktop-bootstrap-linux-x64.sha256

      - name: Attest exact bootstrap bytes
        id: attest
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/vellum-command-desktop-bootstrap-linux-x64

      - name: Copy attestation bundle
        run: |
          set -eu
          test -n "${{ steps.attest.outputs.bundle-path }}"
          cp -- "${{ steps.attest.outputs.bundle-path }}" \
            dist/vellum-command-desktop-bootstrap-linux-x64.attestation.jsonl

      - name: Upload bootstrap artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-desktop-bootstrap
          path: |
            dist/vellum-command-desktop-bootstrap-linux-x64
            dist/vellum-command-desktop-bootstrap-linux-x64.sha256
            dist/vellum-command-desktop-bootstrap-linux-x64.attestation.jsonl
            dist/vellum-command-desktop-bootstrap-linux-x64-relink.json
            dist/vellum-command-desktop-bootstrap-linux-x64-relink-notices.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "${GITHUB_REF_NAME}" \
            dist/vellum-command-desktop-bootstrap-linux-x64 \
            dist/vellum-command-desktop-bootstrap-linux-x64.sha256 \
            dist/vellum-command-desktop-bootstrap-linux-x64.attestation.jsonl \
            dist/vellum-command-desktop-bootstrap-linux-x64-relink.json \
            dist/vellum-command-desktop-bootstrap-linux-x64-relink-notices.txt \
            --title "${GITHUB_REF_NAME}" \
            --notes "Independently attested Linux desktop first-install bootstrap. Not the application update feed. Follow docs/linux-desktop-bootstrap.md."
