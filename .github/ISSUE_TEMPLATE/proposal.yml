name: Proposal or documentation correction
description: Explain a focused improvement to Vellum Command.
body:
  - type: textarea
    id: problem
    attributes:
      label: What work or documentation needs improvement?
      description: Describe the concrete problem and who encounters it.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: Include what the change adds, removes, or makes harder to maintain.
    validations:
      required: true
  - type: markdown
    attributes:
      value: Vellum Command is solo-maintained. Proposals do not imply an implementation commitment or an invitation to submit a pull request.
