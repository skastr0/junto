name: Bug report
description: Report a reproducible problem in Junto.
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, email support@juntoagents.com instead.
        Remove credentials, personal paths, hostnames, and unrelated logs from reports.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the install channel and Node/Bun versions for a source build.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
    validations:
      required: true
  - type: input
    id: features
    attributes:
      label: Feature profile
      description: Default ship profile, or list the experimental features enabled.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal example with synthetic data where possible.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
