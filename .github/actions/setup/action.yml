name: Setup
description: Node, pinned Bun, cached Bun and Electron downloads, frozen install.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 24
        check-latest: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.4.3
    # The lockfile names every package and the Electron version, so it keys both.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.bun/install/cache
          ~/.cache/electron
          ~/Library/Caches/electron
        key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-
    - shell: bash
      run: bun install --frozen-lockfile
