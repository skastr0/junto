# cargo-deny for the native junto CLI: advisories, bans and sources only. No
# licence check: by standing operator rule, no licence step or gate exists
# unless Legal grounds it and the operator approves (product-lead,
# 2026-10-29); notices for the Rust crates are Legal's question.
[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]

# RustSec: a yanked crate fails the build, as a known advisory does.
[advisories]
yanked = "deny"

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
