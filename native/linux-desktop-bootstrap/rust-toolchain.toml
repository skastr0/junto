# The Linux desktop bootstrap's toolchain, the same pin as the native CLI
# (native/cli/rust-toolchain.toml). A bump is one commit with a stated reason.
[toolchain]
channel = "1.98.1"
profile = "minimal"
components = ["clippy", "rustfmt"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
