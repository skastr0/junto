<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GPU canvas frame</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d0e11;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <script type="module" src="./frame.js"></script>
  </body>
</html>
